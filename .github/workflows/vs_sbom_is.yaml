name: Docker Image CI

on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed

jobs:
  build-scan-push:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 1: Build the image and load it into the local Docker daemon (Do not push yet)
      - name: Build local container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # Crucial: Saves the image locally so Trivy can access it
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cbblogs:${{ github.event.workflow_run.head_sha }}

      # STEP 2: Scan the locally built image using Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/cbblogs:${{ github.event.workflow_run.head_sha }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          
        # step 3: we will generate a software bill of materials via syft
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/cbblogs:${{ github.event.workflow_run.head_sha }}
          format: cyclonedx-json
          output-file: sbom.json

      # STEP 4: Push the image (Only runs if Step 2 passes with exit code 0)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cbblogs:${{ github.event.workflow_run.head_sha }}
      
      
      # STEP 5: SIgn the image
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Sign Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cbblogs:${{ github.event.workflow_run.head_sha }}
        run: |
          cosign sign --yes "$IMAGE"
