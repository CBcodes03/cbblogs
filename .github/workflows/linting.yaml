name: linting

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  build:
    # Run only when the PR was actually merged
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout merged master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Verify branch and commit
        run: |
          echo "PR source branch: ${{ github.event.pull_request.head.ref }}"
          echo "PR target branch: ${{ github.event.pull_request.base.ref }}"
          echo "Merged commit: ${{ github.event.pull_request.merge_commit_sha }}"
          echo "Checked out commit: $(git rev-parse HEAD)"

          if [ "${{ github.event.pull_request.base.ref }}" != "master" ]; then
            echo "ERROR: PR was not targeting master"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${{ github.event.pull_request.merge_commit_sha }}" ]; then
            echo "ERROR: Incorrect commit checked out"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Analyse code with pylint
        run: |
          pylint $(git ls-files '*.py') --fail-under=6.0
