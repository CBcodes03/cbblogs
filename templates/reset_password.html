{% extends "base.html" %}
{% block content %}
<div class="auth-container text-center">
  <h2 style="color:#fff; font-weight:600;">Reset Password</h2>
  <p style="color:#bbb;">Enter and confirm your new password.</p>
  <form method="POST" class="mt-4" style="max-width:400px; margin:auto;">
    <div class="mb-3">
      <input type="password" class="form-control text-center" name="password" placeholder="New Password" required 
        style="background:rgba(255,255,255,0.07); border:none; color:#fff;">
    </div>
    <div class="mb-3">
      <input type="password" class="form-control text-center" name="confirm_password" placeholder="Confirm Password" required 
        style="background:rgba(255,255,255,0.07); border:none; color:#fff;">
    </div>
    <button type="submit" class="btn btn-success w-100" 
      style="background:#28a745; border:none; padding:0.6rem; font-weight:500;">
      Update Password
    </button>
  </form>
</div>
{% endblock %}
