{% extends "base.html" %}
{% block content %}
<div class="auth-container text-center">
  <h2 style="color:#fff; font-weight:600;">Verify OTP</h2>
  <p style="color:#bbb;">Enter the OTP sent to your registered email address.</p>
  <form method="POST" class="mt-4" style="max-width:400px; margin:auto;">
    <div class="mb-3">
      <input type="text" class="form-control text-center" name="otp" placeholder="Enter OTP" required 
        style="background:rgba(255,255,255,0.07); border:none; color:#fff;">
    </div>
    <button type="submit" class="btn btn-primary w-100" 
      style="background:#007bff; border:none; padding:0.6rem; font-weight:500;">
      Verify OTP
    </button>
  </form>
</div>
{% endblock %}
